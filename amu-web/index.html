<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)" />
<title>amu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c96442'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23fff' text-anchor='middle'%3Ea%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #faf9f5;
    --surface: #ffffff;
    --text: #1f1e1d;
    --muted: #6b6a66;
    --faint: #93918a;
    --line: #e6e3d9;
    --accent: #c96442;
    --accent-soft: #f4e6df;
    --user-bubble: #f0eee6;
    --code-bg: #f4f2ec;
    --shadow: 0 1px 2px rgba(31, 30, 29, 0.06), 0 8px 24px rgba(31, 30, 29, 0.05);
    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #262624;
      --surface: #30302e;
      --text: #f5f4ef;
      --muted: #a8a69f;
      --faint: #85837c;
      --line: #3d3d3a;
      --accent: #d97757;
      --accent-soft: #3a2f2a;
      --user-bubble: #383836;
      --code-bg: #2b2b29;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.65 var(--sans);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overscroll-behavior-y: none;
  }

  /* ---------------- header ---------------- */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    border-bottom: 1px solid transparent;
    background: var(--bg);
    position: relative;
    z-index: 4;
  }
  header.scrolled { border-bottom-color: var(--line); }
  .wordmark {
    font-family: var(--serif);
    font-size: 22px;
    letter-spacing: -0.2px;
    font-weight: 500;
    display: flex;
    align-items: baseline;
    gap: 7px;
  }
  .wordmark .dot { color: var(--accent); }
  .badge {
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 8px;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }
  .spacer { flex: 1; }
  .status {
    font-size: 11.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .status .led {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--faint);
  }
  .status.ok .led { background: #59a869; }
  .status.err .led { background: #d35b5b; }
  .status.busy .led { background: var(--accent); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }

  details.settings { position: relative; }
  details.settings > summary {
    list-style: none;
    cursor: pointer;
    width: 34px; height: 34px;
    border-radius: 9px;
    display: grid; place-items: center;
    color: var(--muted);
    border: 1px solid transparent;
    font-size: 15px;
  }
  details.settings > summary::-webkit-details-marker { display: none; }
  details.settings[open] > summary,
  details.settings > summary:hover { background: var(--user-bubble); border-color: var(--line); }
  .settings-panel {
    position: absolute;
    right: 0;
    top: 42px;
    width: min(300px, calc(100vw - 32px));
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 14px 16px 16px;
    display: grid;
    gap: 12px;
  }
  .settings-panel h2 {
    margin: 0;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    font-weight: 600;
  }
  .field { display: grid; gap: 4px; }
  .field label { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; }
  .field label b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }

  /* ---------------- conversation ---------------- */
  main {
    flex: 1 1 auto;
    overflow-y: auto;
    scroll-behavior: smooth;
    padding: 8px 0 4px;
  }
  .thread {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .empty {
    max-width: 760px;
    margin: 0 auto;
    padding: 12vh 22px 0;
    text-align: center;
  }
  .empty h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(30px, 8vw, 42px);
    line-height: 1.2;
    letter-spacing: -0.6px;
    margin: 0 0 10px;
  }
  .empty h1 em { color: var(--accent); font-style: italic; }
  .empty p {
    color: var(--muted);
    margin: 0 auto 26px;
    max-width: 44ch;
    font-size: 14.5px;
  }
  .suggestions {
    display: grid;
    gap: 9px;
    text-align: left;
    max-width: 460px;
    margin: 0 auto;
  }
  .suggestion {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow);
    display: flex;
    gap: 10px;
    align-items: center;
    text-align: left;
    font-family: var(--sans);
    line-height: 1.4;
  }
  .suggestion:hover { border-color: #d8d4c8; }
  .suggestion .ico { color: var(--accent); font-size: 13px; }
  .suggestion code { font-family: var(--mono); font-size: 12.5px; background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }

  .msg { display: flex; flex-direction: column; gap: 6px; }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble {
    background: var(--user-bubble);
    border-radius: 18px;
    padding: 10px 16px;
    max-width: min(76%, 560px);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 15.5px;
  }
  .msg.amu .who {
    font-family: var(--serif);
    font-size: 14px;
    color: var(--accent);
    letter-spacing: 0.1px;
  }
  .msg.amu .body {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 15.5px;
  }
  .caret {
    display: inline-block;
    width: 8px;
    height: 1.05em;
    margin-left: 1px;
    vertical-align: text-bottom;
    background: var(--accent);
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .msg .actions {
    display: flex;
    gap: 6px;
    margin-top: 2px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .msg:hover .actions, .msg .actions.show { opacity: 1; }
  .msg button.copy {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--sans);
  }
  .msg button.copy:hover { background: var(--code-bg); color: var(--text); }
  .msg .meta {
    font-size: 11.5px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .msg.amu.error .body { color: #c0503f; }

  /* ---------------- composer ---------------- */
  footer {
    flex: 0 0 auto;
    padding: 6px 16px calc(env(safe-area-inset-bottom) + 10px);
    background: linear-gradient(to top, var(--bg) 72%, transparent);
    position: relative;
    z-index: 4;
  }
  .composer {
    max-width: 760px;
    margin: 0 auto;
  }
  .inputwrap {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 8px 8px 8px 16px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    transition: border-color 0.15s;
  }
  .inputwrap:focus-within { border-color: #cfcabd; }
  textarea#prompt {
    flex: 1;
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 16px;
    line-height: 1.5;
    resize: none;
    outline: none;
    padding: 8px 0;
    max-height: 40dvh;
    min-height: 26px;
  }
  textarea#prompt::placeholder { color: var(--faint); }
  button.send {
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 0;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    line-height: 1;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  button.send:disabled { background: var(--line); color: var(--faint); cursor: not-allowed; }
  button.send:not(:disabled):active { transform: scale(0.94); }
  button.send.stop { background: var(--text); color: var(--bg); font-size: 12px; }
  .hint {
    text-align: center;
    color: var(--faint);
    font-size: 11.5px;
    margin-top: 8px;
  }
  .hint kbd {
    font-family: var(--sans);
    font-size: 11px;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 4px;
    color: var(--muted);
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  @media (max-width: 480px) {
    .msg.user .bubble { max-width: 86%; }
    .badge { display: none; }
  }
</style>
</head>
<body>
<header id="header">
  <div class="wordmark">amu<span class="dot">.</span></div>
  <div class="badge" id="model-badge">loading…</div>
  <div class="spacer"></div>
  <div class="status" id="status"><span class="led"></span><span id="status-text">starting</span></div>
  <details class="settings" id="settings">
    <summary aria-label="Settings">⚙</summary>
    <div class="settings-panel">
      <h2>Generation</h2>
      <div class="field">
        <label for="length">Length <b id="length-value">200</b></label>
        <input id="length" type="range" min="20" max="600" step="20" value="200" />
      </div>
      <div class="field">
        <label for="temperature">Temperature <b id="temperature-value">0.80</b></label>
        <input id="temperature" type="range" min="0" max="1.4" step="0.05" value="0.8" />
      </div>
      <div class="field">
        <label for="topk">Top-k <b id="topk-value">40</b></label>
        <input id="topk" type="range" min="1" max="81" step="1" value="40" />
      </div>
    </div>
  </details>
</header>

<main id="scroller">
  <section class="empty" id="empty">
    <h1>Hi, I'm <em>amu</em>.</h1>
    <p>A 2.9M-parameter character model trained from scratch on CAD and GIS notes. Runs entirely in this browser.</p>
    <div class="suggestions" id="suggestions">
      <button class="suggestion" type="button" data-text="A layer groups"><span class="ico">▸</span>Continue “A layer groups”</button>
      <button class="suggestion" type="button" data-text="The command -LAYER"><span class="ico">▸</span>Explain what <code>-LAYER</code> does</button>
      <button class="suggestion" type="button" data-text="EPSG 25832 is"><span class="ico">▸</span>Describe EPSG&nbsp;25832</button>
      <button class="suggestion" type="button" data-text="(defun c:TMK-"><span class="ico">▸</span>Write an AutoLISP command</button>
    </div>
  </section>
  <div class="thread" id="thread"></div>
</main>

<footer>
  <form class="composer" id="composer">
    <div class="inputwrap">
      <label class="sr-only" for="prompt">Message amu</label>
      <textarea id="prompt" rows="1" placeholder="Message amu…" spellcheck="false" autocapitalize="sentences" disabled></textarea>
      <button class="send" id="send" type="submit" aria-label="Send" disabled>↑</button>
    </div>
    <div class="hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</div>
  </form>
</footer>

<script type="module" src="./app.js"></script>
</body>
</html>
